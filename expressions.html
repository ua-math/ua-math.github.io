<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажер перетворення виразів</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .container { background-color: #ffffff; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); padding: 40px; width: 100%; max-width: 950px; text-align: center; position: relative; }
        
        .counter-badge { 
            position: absolute; 
            top: 20px; 
            right: 20px; 
            background-color: #e2e8f0; 
            color: #475569; 
            padding: 8px 16px; 
            border-radius: 20px; 
            font-size: 1rem; 
            font-weight: bold; 
            cursor: pointer; 
            user-select: none;
            transition: all 0.2s;
            border: 1px solid #cbd5e1;
        }
        .counter-badge:hover { background-color: #f1f5f9; color: #ef4444; border-color: #fca5a5; }
        .counter-badge:active { transform: scale(0.95); }

        h1 { color: #1e293b; font-size: 1.8rem; margin-bottom: 25px; margin-top: 10px; }
        .control-panel { display: flex; flex-direction: column; align-items: center; gap: 20px; margin-bottom: 30px; }
        .tabs { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .tab-btn { background-color: #f1f5f9; color: #475569; border: 2px solid #cbd5e1; border-radius: 8px; padding: 12px 18px; font-size: 1.15rem; font-weight: 600; cursor: pointer; }
        .tab-btn.active { background-color: #2563eb; color: white; border-color: #2563eb; }
        .options { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .checkbox-container { display: flex; align-items: center; gap: 10px; font-size: 1.1rem; font-weight: 600; color: #1e293b; cursor: pointer; background-color: #fff7ed; border: 2px dashed #f97316; padding: 10px 15px; border-radius: 8px; }
        .checkbox-container.inverse { background-color: #f0fdf4; border-color: #10b981; }
        .checkbox-container input { width: 20px; height: 20px; cursor: pointer; }
        .equation-container { overflow-x: auto; white-space: nowrap; background-color: #f8fafc; border: 2px solid #e2e8f0; border-radius: 12px; padding: 40px 20px; margin-bottom: 30px; }
        .equation-display { font-size: 3.5rem; font-weight: bold; color: #0f172a; display: inline-block; }
        .variable { color: #2563eb; font-style: italic; }
        .sign { color: #f97316; font-weight: bold; padding: 0 4px; }
        .btn { background-color: #10b981; color: white; border: none; border-radius: 12px; padding: 18px 36px; font-size: 1.4rem; font-weight: 600; cursor: pointer; width: 100%; max-width: 350px; }
        .btn:hover { background-color: #059669; }
        .hint-text { color: #64748b; font-size: 1.1rem; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="counter-badge" id="counterDisplay" onclick="resetCounter()" title="Натисніть для обнулення">Переглянуто: 0</div>

    <h1>Тренажер перетворення виразів</h1>
    <div class="control-panel">
        <div class="tabs">
            <button class="tab-btn active" onclick="changeMode(0, this)">a(bx + c)</button>
            <button class="tab-btn" onclick="changeMode(1, this)">a(bx + cy)</button>
            <button class="tab-btn" onclick="changeMode(2, this)">(x + a)²</button>
            <button class="tab-btn" onclick="changeMode(3, this)">(x + a)(x + b)</button>
            <button class="tab-btn" onclick="changeMode(4, this)">(x + a)(y + b)</button>
        </div>
        <div class="options">
            <label class="checkbox-container">
                <input type="checkbox" id="minusCheckbox" onchange="generateExample(false)">
                <span><span class="sign">−</span> мінус перед дужками</span>
            </label>
            <label class="checkbox-container inverse">
                <input type="checkbox" id="inverseCheckbox" onchange="generateExample(false)">
                <span>🔄 розкласти на множники</span>
            </label>
        </div>
    </div>
    <div class="equation-container"><div class="equation-display" id="equationBox"></div></div>
    <div class="controls">
        <button class="btn" onclick="generateExample(true)">Інший приклад</button>
        <p class="hint-text">Обирайте шаблони зверху. Скидайте лічильник кліком по ньому.</p>
    </div>
</div>

<script>
    let currentMode = 0;
    let exampleCount = 0;
    const rnd = (min, max) => { let n = 0; while(!n) n = Math.floor(Math.random()*(max-min+1))+min; return n; };

    function changeMode(mode, element) {
        currentMode = mode;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        element.classList.add('active');
        generateExample(true);
    }

    function resetCounter() {
        exampleCount = 0;
        document.getElementById('counterDisplay').innerText = `Переглянуто: ${exampleCount}`;
    }

    function fmt(val, vChar, isFirst) {
        if (!val) return "";
        let s = val > 0 ? (isFirst ? "" : '<span class="sign">+</span>') : '<span class="sign">-</span>';
        let c = (Math.abs(val) === 1 && vChar) ? "" : Math.abs(val);
        return s + c + (vChar ? `<span class="variable">${vChar}</span>` : "");
    }

    function sign(val) { return val > 0 ? '<span class="sign">+</span>' : '<span class="sign">-</span>'; }

    function generateExample(shouldIncrement = true) {
        if (shouldIncrement) {
            exampleCount++;
            document.getElementById('counterDisplay').innerText = `Переглянуто: ${exampleCount}`;
        }

        const isMinus = document.getElementById('minusCheckbox').checked;
        const isInverse = document.getElementById('inverseCheckbox').checked;
        let a = isMinus ? rnd(-6, -2) : rnd(2, 6);
        let left = "", right = "";

        if (currentMode === 0 || currentMode === 1) {
            let b = rnd(2, 5), c = rnd(-8, 9), v2 = currentMode === 1 ? "y" : "";
            let aStr = a < 0 ? '<span class="sign">-</span>' + Math.abs(a) : a;
            left = `${aStr}<span class="sign">(</span>${b}<span class="variable">x</span>${sign(c)}${Math.abs(c)}${v2 ? `<span class="variable">y</span>` : ""}<span class="sign">)</span>`;
            right = fmt(a * b, "x", true) + fmt(a * c, v2, false);
        } else if (currentMode === 2) {
            // Новий третій тип: (x + a)²
            let b = rnd(-9, 9);
            let inner = `<span class="sign">(</span><span class="variable">x</span>${sign(b)}${Math.abs(b)}<span class="sign">)²</span>`;
            left = isMinus ? '<span class="sign">-</span>' + inner : inner;
            
            let m = isMinus ? -1 : 1;
            let coeffX = 2 * b * m;
            let freeTerm = b * b * m;
            let x2Str = isMinus ? '<span class="sign">-</span><span class="variable">x²</span>' : '<span class="variable">x²</span>';
            right = x2Str + fmt(coeffX, "x", false) + fmt(freeTerm, "", false);
        } else if (currentMode === 3) {
            let b = rnd(-6, 6), c = rnd(-6, 6), m = isMinus ? -1 : 1;
            let inner = `<span class="sign">(</span><span class="variable">x</span>${sign(b)}${Math.abs(b)}<span class="sign">)(</span><span class="variable">x</span>${sign(c)}${Math.abs(c)}<span class="sign">)</span>`;
            left = isMinus ? '<span class="sign">-</span>' + inner : inner;
            right = (isMinus ? '<span class="sign">-</span>' : '') + '<span class="variable">x²</span>' + fmt((b + c) * m, "x", false) + fmt(b * c * m, "", false);
        } else {
            let b = rnd(-6, 6), c = rnd(-6, 6), m = isMinus ? -1 : 1;
            let inner = `<span class="sign">(</span><span class="variable">x</span>${sign(b)}${Math.abs(b)}<span class="sign">)(</span><span class="variable">y</span>${sign(c)}${Math.abs(c)}<span class="sign">)</span>`;
            left = isMinus ? '<span class="sign">-</span>' + inner : inner;
            right = fmt(m, "xy", true) + fmt(c * m, "x", false) + fmt(b * m, "y", false) + fmt(b * c * m, "", false);
        }

        if (isInverse) {
            if (right.indexOf('<span class="sign">+</span>') === 0) {
                right = right.substring(27);
            }
            document.getElementById('equationBox').innerHTML = right + ' <span class="sign">=</span> ' + left;
        } else {
            document.getElementById('equationBox').innerHTML = left + ' <span class="sign">=</span> ' + right;
        }
    }
    window.onload = function() { generateExample(true); };
</script>
</body>
</html>
