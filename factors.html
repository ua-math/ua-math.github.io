<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажер: Арифметика та Дроби</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="trainer page-factors">
<div class="container">
    <div class="counter-badge" id="counter" onclick="counter.reset()" title="Натисніть для обнулення">Переглянуто: 0</div>
    <h1>Тренажер: Арифметика та Дроби</h1>
    <div class="control-panel">
        <div class="tabs">
            <button class="tab-btn active" onclick="chM(0, this)">Розклад на множники</button>
            <button class="tab-btn" onclick="chM(1, this)">НСД(a; b)</button>
            <button class="tab-btn" onclick="chM(2, this)">НСК(a; b)</button>
        </div>
        <div class="tabs">
            <button class="tab-btn" onclick="chM(3, this)">Мішані дроби</button>
            <button class="tab-btn" onclick="chM(4, this)">Скорочення дробів</button>
            <button class="tab-btn" onclick="chM(5, this)">Спільний знаменник</button>
        </div>
        <div class="tabs">
            <button class="tab-btn tb-bold" onclick="chM(6, this)">Додавання та віднімання</button>
            <button class="tab-btn tb-bold" onclick="chM(7, this)">Множення та ділення</button>
        </div>
    </div>
    <div class="equation-container"><div class="equation-display" id="box"></div></div>
    <div class="controls"><button class="btn" onclick="gen(true)">Інший приклад</button></div>
</div>
<script>
    var m = 0;

    const counter = {
        n: 0,
        show() { document.getElementById('counter').innerText = 'Переглянуто: ' + this.n; },
        inc() { this.n++; this.show(); },
        reset() { this.n = 0; this.show(); },
    };

    var rnd = function (x, y) { return Math.floor(Math.random() * (y - x + 1)) + x; };
    var gcd = function (x, y) { return y === 0 ? x : gcd(y, x % y); };
    var lcm = function (x, y) { return (x * y) / gcd(x, y); };
    var fN = function (x, cl) { return '<span class="' + (cl || 'nm') + '">' + x + '</span>'; };
    var fS = function (s) { return '<span class="sign">' + s + '</span>'; };

    function getP(i) {
        return parseInt('2,3,5,7,11,13'.split(',')[i]);
    }

    function getC(n, p) {
        var k = 0, v = n;
        while (v % p === 0 && v !== 0) { k++; v /= p; }
        return k;
    }

    function bF(n, d, mp, cN, cD) {
        var sup = mp ? '<span class="mp"><sup>' + mp + '</sup></span>' : '';
        return '<div class="fr"><div class="nu">' + fN(n, cN) + sup + '</div><div class="de">' + fN(d, cD) + '</div></div>';
    }

    function bS(n, d, mp) {
        var sup = mp ? '<span class="mp"><sup>' + mp + '</sup></span>' : '';
        return '<div class="fr"><div class="nu"><s>' + fN(n) + '</s>' + sup + '</div><div class="de"><s>' + fN(d) + '</s></div></div>';
    }

    function reduction(n, d) {
        var g = gcd(n, d);
        if (g <= 1) return '';
        return fS('=') + bS(n, d, ':' + g) + fS('=') + bF(n / g, d / g);
    }

    function buildP(n, co, g) {
        var out = '', f = true;
        for (var i = 0; i < 6; i++) {
            var p = getP(i), c1 = getC(n, p), c2 = co ? getC(co, p) : 0;
            if (c1 !== 0) {
                if (!f) out += fS('·');
                var txt = fN(p) + (c1 !== 1 ? '<sup>' + c1 + '</sup>' : '');
                if (co && (g ? (c1 <= c2) : (c1 >= c2))) txt = '<span class="hc">' + txt + '</span>';
                out += txt;
                f = false;
            }
        }
        return out;
    }

    function buildR(n1, n2, g) {
        var out = '', f = true;
        for (var i = 0; i < 6; i++) {
            var p = getP(i), t = g ? Math.min(getC(n1, p), getC(n2, p)) : Math.max(getC(n1, p), getC(n2, p));
            if (t !== 0) {
                if (!f) out += fS('·');
                out += fN(p) + (t !== 1 ? '<sup>' + t + '</sup>' : '');
                f = false;
            }
        }
        return out === '' ? fN('1') : out;
    }

    function buildCh(n) {
        var out = '', v = n, f = true;
        for (var i = 0; i < 6; i++) {
            var p = getP(i);
            while (v % p === 0) {
                if (!f) out += fS('·');
                out += fN(p);
                v /= p;
                f = false;
            }
        }
        return out;
    }

    function getSmart() {
        var res = 1;
        res *= getP(rnd(3, 5));
        for (var i = 0; i < 4; i++) {
            var p = getP(rnd(0, 5));
            if (res * p <= 220) res *= p;
        }
        return res;
    }

    function twoFractions(lo, hi) {
        var sd1 = rnd(lo, hi), sd2 = rnd(lo, hi);
        while (sd1 === sd2) sd2 = rnd(lo, hi);
        var sn1 = rnd(1, sd1 - 1), sn2 = rnd(1, sd2 - 1);
        return [sd1, sd2, sn1, sn2];
    }

    function chM(x, el) {
        m = x;
        var b = document.querySelectorAll('.tab-btn');
        for (var i = 0; i < b.length; i++) b[i].classList.remove('active');
        el.classList.add('active');
        gen(true);
    }

    function gen(inc) {
        if (inc) counter.inc();
        var box = document.getElementById('box'), html = '';

        if (m === 0) {
            var num = getSmart(), chStr = buildCh(num), pStr = buildP(num, 0, false);
            html = fN(num) + fS('=') + chStr + (chStr === pStr ? '' : fS('=') + pStr);
        } else if (m === 1 || m === 2) {
            var n1 = getSmart(), n2 = getSmart();
            while (n1 === n2) n2 = getSmart();
            var isG = m === 1, lbl = '<span class="lb">' + (isG ? 'НСД' : 'НСК') + '</span>';
            var p2 = lbl + fS('(') + buildP(n1, n2, isG) + fS(';') + buildP(n2, n1, isG) + fS(')'),
                p3 = buildR(n1, n2, isG),
                p4 = fN(isG ? gcd(n1, n2) : lcm(n1, n2));
            html = lbl + fS('(') + fN(n1) + fS(';') + fN(n2) + fS(')') + fS('=') + p2 + (p3 === p4 ? '' : fS('=') + p3) + fS('=') + p4;
        } else if (m === 3) {
            var sd = rnd(3, 9), wh = rnd(1, 5), re = rnd(1, sd - 1), num = wh * sd + re;
            html = bF(num, sd) + fS('➔') + bF(wh * sd + '+' + re, sd) + fS('➔') + bF(wh * sd, sd, 0, 'wh') + fS('+') + bF(re, sd) + fS('=') + '<span class="wh">' + wh + '</span>' + bF(re, sd, '', 0, 'nm');
        } else if (m === 4) {
            var com = rnd(2, 7), sd = rnd(3, 9), sn = rnd(1, sd - 1);
            while (gcd(sn, sd) > 1) { sd = rnd(3, 9); sn = rnd(1, sd - 1); }
            html = bF(sn * com, sd * com) + fS(' ➔ ') + bS(sn * com, sd * com, ':' + com) + fS('=') + bF(sn, sd);
        } else if (m === 5) {
            var [sd1, sd2, sn1, sn2] = twoFractions(3, 8);
            var fd = lcm(sd1, sd2), m1 = fd / sd1, m2 = fd / sd2;
            html = bF(sn1, sd1, '(' + m1 + ')') + '<span class="lb"> і </span>' + bF(sn2, sd2, '（' + m2 + ')') + fS(' ➔ ') + bF(sn1 * m1, fd) + '<span class="lb"> і </span>' + bF(sn2 * m2, fd);
        } else if (m === 6) {
            var [sd1, sd2, sn1, sn2] = twoFractions(3, 8);
            var isAdd = rnd(0, 1) == 1, op = isAdd ? '+' : '-';
            var fd = lcm(sd1, sd2), m1 = fd / sd1, m2 = fd / sd2;
            var top1 = sn1 * m1, top2 = sn2 * m2, fn = isAdd ? (top1 + top2) : (top1 - top2);
            if (fn <= 0) { op = '+'; fn = top1 + top2; }
            html = bF(sn1, sd1, '(' + m1 + ')') + fS(op) + bF(sn2, sd2, '(' + m2 + ')') + fS('=') + bF(top1 + op + top2, fd)
                 + fS('=') + bF(fn, fd) + reduction(fn, fd);
        } else {
            var [sd1, sd2, sn1, sn2] = twoFractions(3, 8);
            var isM = rnd(0, 1) == 1, op = isM ? '·' : ':';
            html = bF(sn1, sd1, 0, 'nm', 'vl') + fS(op) + bF(sn2, sd2, 0, 'nm', 'vl') + fS('=');
            var fn = isM ? sn1 * sn2 : sn1 * sd2, fd = isM ? sd1 * sd2 : sd1 * sn2;
            if (isM) {
                html += bF(sn1 + '·' + sn2, sd1 + '·' + sd2, 0, 'nm', 'vl')
                      + fS('=') + bF(fn, fd, '', 0, 'vl') + reduction(fn, fd);
            } else {
                html += bF(sn1, sd1, 0, 'nm', 'vl') + fS('·') + bF(sd2, sn2, 0, 'vl', 'nm')
                      + fS('=') + bF(fn, fd, '', 0, 'nm') + reduction(fn, fd);
            }
        }
        box.innerHTML = html;
    }

    window.onload = function () { gen(true); };
</script>
</body>
</html>
